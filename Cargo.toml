[package]
name = "hawkeye"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = { version= "0.4.42", features = ["clock"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12.27", features = ["cookies", "json", "multipart", "stream"] }
yup-oauth2 = "12.1.1"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }
dotenv = "0.15.0"
tracing = "0.1"
tracing-subscriber = "0.3"
cron = "0.16"
rumqttc = "0.25"
